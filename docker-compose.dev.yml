# Разработка без контейнеров: база в Docker, API и фронтенд — локально.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
#   npm run migrate && npm run dev
#
# Порт публикуется только на интерфейс 127.0.0.1: база доступна разработчику
# и недоступна из сети. При первом создании тома создаётся отдельная база
# edu_diary_test для интеграционных тестов и e2e (TEST_DATABASE_URL в .env).

services:
  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./docker/postgres-dev-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
