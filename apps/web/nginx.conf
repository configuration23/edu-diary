# Раздача статики React-приложения. Проксированием /api занимается Caddy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Файлы со хешем в имени кешируются надолго.
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируется: после обновления пользователь получает новую сборку.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
