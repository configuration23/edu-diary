# Стек edu-diary: postgres + api + web + caddy (ARCHITECTURE.md §12).
#
# Значения секретов в этом файле отсутствуют намеренно: они приходят из .env
# (создаётся командой `npm run bootstrap:env`) и обязательны — без них compose
# останавливается с понятным сообщением (SECURITY.md §3.2).
#
# Локальный запуск:   npm run bootstrap:env && docker compose up
# Прод:               docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Только база для разработки:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres

name: edu-diary

# Внешние образы закреплены дайджестами: версия не «уплывёт» между сборками.
# Префикс реестра настраивается переменной DOCKER_REGISTRY — она нужна там, где
# доступ к Docker Hub ограничен и используется зеркало
# (например, DOCKER_REGISTRY=mirror.example.ru/library/). По умолчанию — Docker Hub.
x-postgres-image: &postgres-image ${DOCKER_REGISTRY:-}postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
x-caddy-image: &caddy-image ${DOCKER_REGISTRY:-}caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
x-nginx-image: &nginx-image ${DOCKER_REGISTRY:-}nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Внутри compose база доступна по имени сервиса, а не по localhost.
  DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required - run npm run bootstrap:env}
  STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY is required - run npm run bootstrap:env}

services:
  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Наружу не публикуется: доступ только из внутренней сети Docker (SECURITY.md §3.2).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  # Миграции применяются отдельным шагом, а не при старте API (ARCHITECTURE.md §12).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: edu-diary-api:local
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-environment
    command: ['node', 'apps/api/dist/migrate.js']
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: edu-diary-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *api-environment
    healthcheck:
      test: ['CMD', 'node', 'apps/api/scripts/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: edu-diary-web:local
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  caddy:
    image: *caddy-image
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      # Порт задаётся в .env; он же должен быть указан в SITE_ADDRESS.
      # Если 8080 занят, достаточно поменять HTTP_PORT и SITE_ADDRESS.
      - '${HTTP_PORT:-8080}:${HTTP_PORT:-8080}'
    environment:
      # `:8080` — «любой хост на порту 8080»: стек открывается и по IP стенда.
      # На сервере с доменом укажите SITE_ADDRESS=diary.example.ru (тогда Caddy
      # получит сертификат и будет слушать 80/443 — см. docker-compose.prod.yml).
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
